name: CI Pipeline

on:
  push:
    branches:
      - dev
      - staging
      - main
      - feature/**

  pull_request:
    branches:
      - dev
      - staging
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Check Secret Exists
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "Secret is missing"
            exit 1
          else
            echo "API_KEY secret exists"
          fi

      - name: Run Tests
        run: npx jest